<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Black Tube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--bg2:#0e0809;--bg3:#1a0c0e;--tx:#f6f1f1;--mut:#9a8c8d;--ac:#e50914;--ac2:#ff3b3b;--bd:#2a1416;--err:#ffa94d}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;padding:14px 5vw;background:rgba(0,0,0,.85);backdrop-filter:blur(14px);border-bottom:1px solid #3a1014}
.logo{font-family:Syne,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.5px;direction:ltr;display:flex;align-items:center;gap:10px}
.logo i{width:38px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--ac2),var(--ac));display:grid;place-items:center}
.logo i::after{content:"";border-inline-start:9px solid #fff;border-block:6px solid transparent;margin-inline-start:-2px;transform:scaleX(-1)}
.logo b{color:var(--ac)}
.search{flex:1;max-width:460px;margin-inline:auto}
.search input{width:100%;padding:10px 18px;border-radius:99px;border:1px solid var(--bd);background:var(--bg2)}
.search input:focus{border-color:var(--ac);outline:0}
.btn{border:0;cursor:pointer;padding:10px 22px;border-radius:99px;background:var(--ac);color:#fff;font-weight:700;box-shadow:0 6px 22px rgba(229,9,20,.35)}
.btn:hover{background:var(--ac2)}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.g:hover{border-color:var(--ac);color:var(--ac)}
.btn.d{background:transparent;color:var(--err);border:1px solid #4a2a14;box-shadow:none}
.banner{background:var(--ac);color:#fff;text-align:center;padding:8px 5vw;font-weight:700}
main{padding:0 5vw 80px;max-width:1500px;margin:auto}
.hero{position:relative;margin:28px 0 36px;border-radius:22px;overflow:hidden;min-height:min(62vh,540px);display:flex;align-items:flex-end;background:radial-gradient(120% 90% at 80% 0,#6b0a12,#000 70%);border:1px solid var(--bd);box-shadow:0 0 80px rgba(229,9,20,.12)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.65}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000 8%,transparent 70%)}
.hero .in{position:relative;z-index:2;padding:clamp(22px,4vw,52px);max-width:720px}
.hero h1{font-family:Syne,sans-serif;font-weight:800;font-size:clamp(34px,6vw,72px);line-height:1.05;margin:0 0 12px}
.hero p{color:#d6cccc;margin:0 0 22px;font-size:17px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.chip{border:1px solid var(--bd);background:var(--bg2);padding:7px 18px;border-radius:99px;cursor:pointer;color:var(--mut)}
.chip.on,.chip:hover{border-color:var(--ac);color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:28px 22px}
.card{display:block}
.th{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--bg3);border:1px solid var(--bd);transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover .th{transform:translateY(-4px);border-color:var(--ac);box-shadow:0 12px 34px rgba(229,9,20,.3)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;bottom:8px;inset-inline-start:8px;background:rgba(0,0,0,.8);padding:1px 8px;border-radius:6px;font-size:12px;direction:ltr}
.card h3{margin:10px 2px 0;font-size:16px;line-height:1.4}
.card small{color:var(--mut);margin-inline:2px}
.empty{text-align:center;padding:90px 20px;color:var(--mut);border:1px dashed var(--bd);border-radius:18px}
.empty h2{font-family:Syne,sans-serif;color:var(--tx);margin:0 0 8px}
.watch{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;margin-top:26px}
.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;border:1px solid var(--bd);display:block}
.watch h1{font-family:Syne,sans-serif;font-size:clamp(24px,3.4vw,38px);margin:18px 0 6px;line-height:1.2}
.desc{color:#d6cccc;white-space:pre-wrap;background:var(--bg2);padding:18px;border-radius:14px;margin-top:16px}
.side{display:flex;flex-direction:column;gap:18px}
.lock{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--mut)}
.lock h1{font-family:Syne,sans-serif;color:var(--tx);font-size:44px;margin:0}
.panel{background:var(--bg2);border:1px solid var(--bd);border-radius:18px;padding:24px;margin-top:22px}
.panel h2{font-family:Syne,sans-serif;margin:0 0 16px;font-size:22px}
.f{display:grid;gap:14px}.f.two{grid-template-columns:1fr 1fr}
label{display:grid;gap:6px;color:var(--mut);font-size:14px}
input,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;width:100%}
input:focus,textarea:focus{border-color:var(--ac);outline:0}
.row{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;flex-wrap:wrap}
.row img{width:128px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--bg3)}
.row .t{flex:1;min-width:160px}.row .t small{color:var(--mut)}
.tag{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}
.tag.ok{color:var(--ac);border-color:var(--ac)}
.prev video,.prev canvas{width:100%;max-width:520px;border-radius:12px;background:#000;display:block}
.bar{height:8px;border-radius:9px;background:var(--bg3);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac)}
.msg{color:var(--ac2);min-height:24px}.msg.e{color:var(--err)}
.tog{display:flex;gap:10px;align-items:center;color:var(--tx)}.tog input{width:auto}
.tabs{display:flex;gap:10px;margin-top:22px;align-items:center}
footer{position:relative;border-top:1px solid var(--bd);padding:26px 5vw;color:var(--mut);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
#secret{position:absolute;left:0;bottom:0;width:80px;height:80px;opacity:0;border:0;padding:0;background:transparent;cursor:default;-webkit-tap-highlight-color:transparent}
@media(max-width:900px){.watch{grid-template-columns:1fr}.f.two{grid-template-columns:1fr}.search{order:3;flex-basis:100%;max-width:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <a class="logo" href="#home" aria-label="Black Tube"><i></i>Black<b>Tube</b></a>
  <div class="search"><input id="q" type="search" placeholder="ابحث عن فيديو..." aria-label="بحث"></div>
</header>
<div id="bn"></div>
<main id="app"></main>
<footer><span class="logo" style="font-size:18px">Black<b>Tube</b></span><span>فيديوهات طويلة بأعلى جودة</span><button id="secret" aria-label=" " tabindex="-1"></button></footer>

<script>
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML};
const media=f=>'/media/'+encodeURIComponent(f);
const fmt=t=>{if(!t)return'';t=Math.round(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
let site={config:{},videos:[]},adm=null,cat='',qs='',editing=null,pFile=null,pThumb=null;

async function api(u,o={}){
  const r=await fetch(u,o);let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw Object.assign(new Error(j.error||'حدث خطأ'),{status:r.status});return j;
}
function send(method,url,fd,onp){return new Promise((res,rej)=>{
  const x=new XMLHttpRequest();x.open(method,url);
  x.upload.onprogress=e=>e.lengthComputable&&onp(Math.round(e.loaded/e.total*100));
  x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}x.status<300?res(j):rej(new Error(j.error||'فشل الرفع'))};
  x.onerror=()=>rej(new Error('انقطع الاتصال'));x.send(fd)})}
async function load(){try{site=await api('/api/site')}catch(e){}$('#bn').innerHTML=site.config.banner?'<div class="banner">'+esc(site.config.banner)+'</div>':'';route()}

/* ---- الواجهة العامة ---- */
const card=v=>'<a class="card" href="#watch-'+v.id+'"><div class="th">'+(v.thumb?'<img loading="lazy" alt="" src="'+media(v.thumb)+'">':'')+(v.dur?'<span class="dur">'+fmt(v.dur)+'</span>':'')+'</div><h3>'+esc(v.title)+'</h3><small>'+esc(v.cat||'')+'</small></a>';
function home(){
  const all=site.videos;
  if(site.config.locked){app.innerHTML='<div class="lock"><div><h1>الموقع مغلق مؤقتاً</h1><p>نرجع قريباً.</p></div></div>';return}
  const cats=[...new Set(all.map(v=>v.cat).filter(Boolean))];
  const list=all.filter(v=>(!cat||v.cat===cat)&&(!qs||(v.title+' '+(v.desc||'')).toLowerCase().includes(qs)));
  const f=all.find(v=>v.featured)||all[0];let h='';
  if(f&&!qs&&!cat)h+='<section class="hero">'+(f.thumb?'<img alt="" src="'+media(f.thumb)+'">':'')+'<div class="in"><h1>'+esc(f.title)+'</h1><p>'+esc((f.desc||'').slice(0,160))+'</p><a class="btn" href="#watch-'+f.id+'">شاهد الآن</a></div></section>';
  else if(!f)h+='<section class="hero"><div class="in"><h1>Black Tube</h1><p>منصة الفيديوهات الطويلة بجودة عالية.</p></div></section>';
  if(cats.length)h+='<div class="chips"><button class="chip'+(cat?'':' on')+'" data-c="">الكل</button>'+cats.map(c=>'<button class="chip'+(cat===c?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>';
  h+=list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<div class="empty"><h2>لا توجد فيديوهات بعد</h2></div>';
  app.innerHTML=h;app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;home()});
}
function watch(id){
  const v=site.videos.find(x=>x.id===id);
  if(!v){app.innerHTML='<div class="empty" style="margin-top:30px"><h2>الفيديو غير موجود</h2><a class="btn" href="#home">الرئيسية</a></div>';return}
  app.innerHTML='<div class="watch"><div><video class="player" controls autoplay playsinline preload="metadata" '+(v.thumb?'poster="'+media(v.thumb)+'"':'')+' src="'+media(v.file)+'"></video><h1>'+esc(v.title)+'</h1><span class="tag ok">'+esc(v.cat||'عام')+'</span>'+(v.desc?'<div class="desc">'+esc(v.desc)+'</div>':'')+'</div><div class="side">'+site.videos.filter(x=>x.id!==id).slice(0,8).map(card).join('')+'</div></div>';
  window.scrollTo(0,0);
}

/* ---- الأدمن ---- */
async function admin(){
  try{adm=await api('/api/admin/site')}catch(e){adm=null}
  if(!adm){
    app.innerHTML='<div class="lock"><div style="width:min(380px,90vw)"><h1>الإدارة</h1><p>أدخل كلمة السر للمتابعة</p><div class="f"><input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password"><button class="btn" id="go">دخول</button><div class="msg e" id="m"></div></div></div></div>';
    const go=async()=>{try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});admin()}catch(e){$('#m').textContent=e.message}};
    $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key==='Enter')go()};return;
  }
  const vs=adm.videos,c=adm.config;
  let h='<div class="tabs"><span class="logo" style="font-size:22px">لوحة التحكم</span><button class="btn g" id="out" style="margin-inline-start:auto">خروج</button></div>';
  h+='<div class="panel"><h2>'+(editing?'تعديل فيديو':'إضافة فيديو')+'</h2><div class="f"><div class="f two"><label>العنوان<input id="t"></label><label>التصنيف<input id="c" placeholder="مثال: وثائقي"></label></div><label>الوصف<textarea id="d" rows="3"></textarea></label>'
   +(editing?'':'<label>ملف الفيديو<input id="vf" type="file" accept="video/*"></label><div class="prev" id="pv"></div>')
   +'<label>صورة مصغرة مخصصة (اختياري)<input id="tf" type="file" accept="image/*"></label><div class="tog"><input type="checkbox" id="ft"><span>فيديو مميّز في الواجهة</span></div>'
   +'<div style="display:flex;gap:10px"><button class="btn" id="sv">'+(editing?'حفظ التعديل':'نشر الفيديو')+'</button>'+(editing?'<button class="btn g" id="cn">إلغاء</button>':'')+'</div><div class="bar" id="bar" hidden><i></i></div><div class="msg" id="m"></div></div></div>';
  h+='<div class="panel"><h2>الفيديوهات ('+vs.length+')</h2>'+(vs.length?vs.map(v=>'<div class="row"><img alt="" src="'+(v.thumb?media(v.thumb):'')+'"><div class="t"><b>'+esc(v.title)+'</b><br><small>'+esc(v.cat||'')+'</small> '+(v.featured?'<span class="tag ok">مميّز</span>':'')+(v.hidden?' <span class="tag">مخفي</span>':'')+'</div><button class="btn g" data-a="ed" data-i="'+v.id+'">تعديل</button><button class="btn g" data-a="hd" data-i="'+v.id+'">'+(v.hidden?'إظهار':'إخفاء')+'</button><button class="btn g" data-a="ft" data-i="'+v.id+'">'+(v.featured?'إلغاء التمييز':'تمييز')+'</button><button class="btn d" data-a="rm" data-i="'+v.id+'">حذف</button></div>').join(''):'<p style="color:var(--mut)">لا توجد فيديوهات.</p>')+'</div>';
  h+='<div class="panel"><h2>إعدادات الموقع</h2><div class="f"><label>شريط إعلان أعلى الموقع<input id="bnr" value="'+esc(c.banner||'')+'"></label><div class="tog"><input type="checkbox" id="lk"'+(c.locked?' checked':'')+'><span>قفل الموقع للزوار (صيانة)</span></div><button class="btn" id="ss" style="justify-self:start">حفظ الإعدادات</button><div class="msg" id="m2"></div></div></div>';
  app.innerHTML=h;
  if(editing){const v=vs.find(x=>x.id===editing);if(v){$('#t').value=v.title;$('#c').value=v.cat||'';$('#d').value=v.desc||'';$('#ft').checked=!!v.featured}}
  $('#out').onclick=async()=>{await api('/api/logout',{method:'POST'});editing=null;location.hash='home'};
  if($('#cn'))$('#cn').onclick=()=>{editing=null;admin()};
  if($('#vf'))$('#vf').onchange=prep;
  $('#sv').onclick=saveVideo;$('#ss').onclick=saveCfg;
  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.i));
}
function prep(){
  pFile=$('#vf').files[0];pThumb=null;if(!pFile)return;
  $('#pv').innerHTML='<video id="pvv" controls muted src="'+URL.createObjectURL(pFile)+'"></video><p style="color:var(--mut);margin:8px 0">حرّك الفيديو للقطة التي تعجبك ثم اضغط:</p><button class="btn g" id="cap" type="button">اعتماد هذه اللقطة كصورة مصغرة</button><canvas id="cv" hidden></canvas>';
  $('#cap').onclick=()=>{const v=$('#pvv'),cv=$('#cv');cv.width=v.videoWidth;cv.height=v.videoHeight;cv.getContext('2d').drawImage(v,0,0);cv.toBlob(b=>{pThumb=b;cv.hidden=false;$('#m').textContent='تم اعتماد اللقطة'},'image/jpeg',.9)};
}
async function saveVideo(){
  const m=$('#m');m.className='msg';
  const fd=new FormData();fd.append('title',$('#t').value);fd.append('cat',$('#c').value);fd.append('desc',$('#d').value);fd.append('featured',$('#ft').checked?'1':'0');
  const tf=$('#tf').files[0]||pThumb;if(tf)fd.append('thumb',tf,'thumb.jpg');
  if(!editing){if(!pFile){m.className='msg e';m.textContent='اختر ملف فيديو';return}fd.append('video',pFile);const v=$('#pvv');if(v&&v.duration)fd.append('dur',v.duration)}
  const bar=$('#bar');bar.hidden=false;
  try{await send(editing?'PUT':'POST','/api/admin/videos'+(editing?'/'+editing:''),fd,p=>{bar.firstChild.style.width=p+'%';m.textContent='جارٍ الرفع '+p+'%'});editing=null;pFile=pThumb=null;await load();await admin();$('#m').textContent='تم الحفظ'}
  catch(e){m.className='msg e';m.textContent=e.message}
}
async function act(a,id){
  const v=adm.videos.find(x=>x.id===id),j=o=>({method:'PUT',body:o});
  try{
    if(a==='ed'){editing=id;await admin();window.scrollTo(0,0);return}
    if(a==='rm'){if(!confirm('حذف هذا الفيديو نهائياً؟'))return;await api('/api/admin/videos/'+id,{method:'DELETE'})}
    else{const fd=new FormData();fd.append(a==='hd'?'hidden':'featured',(a==='hd'?!v.hidden:!v.featured)?'1':'0');await api('/api/admin/videos/'+id,j(fd))}
    await load();admin();
  }catch(e){alert(e.message)}
}
async function saveCfg(){
  const m=$('#m2');
  try{await api('/api/admin/config',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({banner:$('#bnr').value,locked:$('#lk').checked})});await load();m.className='msg';m.textContent='تم حفظ الإعدادات'}
  catch(e){m.className='msg e';m.textContent=e.message}
}

function route(){const h=location.hash.slice(1);if(h==='admin')admin();else if(h.startsWith('watch-'))watch(h.slice(6));else home()}
addEventListener('hashchange',route);
$('#secret').onclick=()=>{location.hash='admin'};
$('#q').oninput=e=>{const v=e.target.value.trim().toLowerCase();if(v==='#admin'){e.target.value='';location.hash='admin';return}qs=v;if(location.hash&&location.hash!=='#home')location.hash='home';else home()};
load();
</script>
</body>
</html>
